<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Q3 销售额</title>
<script src="./vendor/chart.umd.min.js"></script>
</head>
<body>
<h1>Q3 各区域销售额</h1>
<p>单位：万元。</p>
<canvas id="sales" width="640" height="320"></canvas>
<script>
const ctx = document.getElementById('sales');
new Chart(ctx, {
  type: 'bar',
  data: {
    labels: ['华北', '华东', '华南', '西部'],
    datasets: [
      { label: '7月', data: [120, 190, 150, 80] },
      { label: '8月', data: [135, 210, 160, 95] },
      { label: '9月', data: [128, 230, 171, 102] }
    ]
  },
  options: { responsive: false, plugins: { legend: { position: 'bottom' } } }
});
</script>

<h2>转化率与客单价</h2>
<canvas id="scatter"></canvas>
<script>
new Chart(document.getElementById('scatter').getContext('2d'), {
  type: 'scatter',
  data: { datasets: [{ label: '门店', data: [{x: 2.1, y: 310}, {x: 3.4, y: 280}, {x: 1.8, y: 402}, {x: 4.0, y: 255}] }] }
});
</script>

<h2>手绘的 SVG（没有脚本）</h2>
<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="10" width="120" height="16" fill="#4f46e5"/>
  <rect x="0" y="34" width="180" height="16" fill="#22c55e"/>
  <text x="125" y="23" font-size="12">去年</text>
</svg>
</body>
</html>
