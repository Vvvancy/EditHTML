<center><font size="5" face="黑体" color="navy"><b>2008 年的学习笔记</b></font></center>
<p>这里有<b>粗体</b>、<i>斜体</i>、<u>下划线</u>、<strike>删除线</strike>、<del>删除</del>、<ins>插入</ins>、<tt>等宽</tt>、<big>大字</big>、<small>小字</small>。</p>
<p><font color="red">红色的 font</font>、<font color="#0000ff" size="4">蓝色大字</font>、<font face="Courier New">只改字体</font>。</p>
<p><span style="color: red;">span 红色文字</span>、<span style="background-color: #ffff00">黄色背景</span>、<span style="color:#16a34a; font-weight:bold">绿色加粗</span>、<span style="font-size: 20px">只改字号</span>、<span class="hl">只有 class</span>。</p>
<p><b><i>粗斜体</i></b>、<i><b>斜粗体</b></i>、<b>相邻</b><b>粗体</b>、<B>大写标签</B>、<I>大写 I</I>。</p>
<p><em>本来就合法的</em> <strong>白名单</strong> <mark>标记</mark> <s>s</s> <sub>sub</sub> <sup>sup</sup> <kbd>kbd</kbd> <code>code</code>。</p>
<p>非白名单但有语义：<abbr title="HyperText Markup Language">HTML</abbr>、<cite>《三体》</cite>、<q>引号</q>、<dfn>定义</dfn>、<var>x</var>、<samp>输出</samp>、<time datetime="2008-08-08">2008-08-08</time>。</p>
<p>换行<br>用 br，<nobr>不换行 nobr</nobr>，<blink>闪烁</blink>，<marquee>跑马灯</marquee>。</p>
</body>
