<h1>贝叶斯公式</h1>

<!-- 情况 A：源码中是未渲染的 TeX 分隔符，MathJax 在运行时替换 -->
<p>条件概率定义为 \(P(A \mid B) = \frac{P(A \cap B)}{P(B)}\)，其中 $P(B) &gt; 0$。</p>
<p>\[
P(A \mid B) = \frac{P(B \mid A)\,P(A)}{P(B)}
\]</p>

<!-- 情况 B：MathJax 2 预处理后的形态：script type="math/tex" 保存了 TeX -->
<p>全概率公式：<span class="MathJax_Preview">P(B)=∑P(B|A_i)P(A_i)</span><script type="math/tex; mode=display">P(B) = \sum_i P(B \mid A_i)\,P(A_i)</script></p>
<p>期望 <script type="math/tex">\mathbb{E}[X]</script> 是线性的。</p>
