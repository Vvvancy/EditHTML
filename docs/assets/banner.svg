<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="EditHTML — 像 Markdown 一样随手编辑，像网站一样好看">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#1d1033"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0; 0.3 0; -0.3 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="blobA"><stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobB"><stop offset="0" stop-color="#ec4899" stop-opacity="0.45"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobC"><stop offset="0" stop-color="#06b6d4" stop-opacity="0.4"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="380" rx="24"/></clipPath>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .chip{animation:float 6s ease-in-out infinite}
      .c2{animation-delay:-1.5s}.c3{animation-delay:-3s}.c4{animation-delay:-4.5s}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      .caret{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .type{animation:type 5s steps(18) infinite}
      @keyframes type{0%{width:0}55%,85%{width:300px}100%{width:0}}
    </style>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle cx="180" cy="80" r="260" fill="url(#blobA)"><animate attributeName="cx" values="180;260;180" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="320" r="280" fill="url(#blobB)"><animate attributeName="cy" values="320;250;320" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="40" r="200" fill="url(#blobC)"><animate attributeName="cx" values="760;680;760" dur="16s" repeatCount="indefinite"/></circle>

    <!-- logo mark -->
    <g transform="translate(96 104)">
      <rect width="96" height="96" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="48" y="62" text-anchor="middle" class="m" font-size="38" font-weight="700" fill="url(#title)">&lt;/&gt;</text>
      <rect x="66" y="66" width="22" height="22" rx="6" fill="#f472b6"/>
      <path d="M71 81l6-10 6 10" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="220" y="158" class="t" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#title)">EditHTML</text>
    <text x="224" y="202" class="t" font-size="26" fill="#e2e8f0" fill-opacity="0.92">像 Markdown 一样随手编辑，像网站一样好看。</text>

    <!-- typing line -->
    <g transform="translate(224 236)">
      <rect width="360" height="44" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#334155"/>
      <text x="16" y="29" class="m" font-size="17" fill="#64748b">›</text>
      <clipPath id="typeclip"><rect class="type" x="34" y="0" width="300" height="44"/></clipPath>
      <text x="34" y="29" class="m" font-size="17" fill="#a5b4fc" clip-path="url(#typeclip)">/chart  插入一个图表 ✨</text>
      <rect class="caret" x="336" y="13" width="2" height="20" fill="#f472b6"/>
    </g>

    <text x="224" y="322" class="t" font-size="15" fill="#94a3b8">文件即网页 · 就地编辑 · Markdown 手感 · 富组件 · 稳定序列化 · 零 DOM 内核</text>

    <!-- floating chips -->
    <g transform="translate(800 70)"><g class="chip">
      <rect width="168" height="46" rx="12" fill="#1e293b" stroke="#6366f1" stroke-opacity="0.6"/>
      <text x="18" y="30" class="m" font-size="18" fill="#c7d2fe"># 二分查找</text>
    </g></g>
    <g transform="translate(990 120)"><g class="chip c2">
      <rect width="150" height="46" rx="12" fill="#1e293b" stroke="#f472b6" stroke-opacity="0.6"/>
      <text x="18" y="30" class="m" font-size="18" fill="#fbcfe8">**O(log n)**</text>
    </g></g>
    <g transform="translate(830 150)"><g class="chip c3">
      <rect width="140" height="128" rx="14" fill="#1e293b" stroke="#22d3ee" stroke-opacity="0.55"/>
      <text x="16" y="28" class="m" font-size="13" fill="#67e8f9">&lt;eh-chart&gt;</text>
      <rect x="20" y="96" width="18" height="16" rx="3" fill="#22d3ee"><animate attributeName="height" values="16;40;16" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="96;72;96" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="46" y="64" width="18" height="48" rx="3" fill="#818cf8"><animate attributeName="height" values="48;28;48" dur="3.4s" repeatCount="indefinite"/><animate attributeName="y" values="64;84;64" dur="3.4s" repeatCount="indefinite"/></rect>
      <rect x="72" y="80" width="18" height="32" rx="3" fill="#f472b6"><animate attributeName="height" values="32;56;32" dur="2.8s" repeatCount="indefinite"/><animate attributeName="y" values="80;56;80" dur="2.8s" repeatCount="indefinite"/></rect>
      <rect x="98" y="52" width="18" height="60" rx="3" fill="#a78bfa"><animate attributeName="height" values="60;36;60" dur="3.2s" repeatCount="indefinite"/><animate attributeName="y" values="52;76;52" dur="3.2s" repeatCount="indefinite"/></rect>
    </g></g>
    <g transform="translate(1000 196)"><g class="chip c4">
      <rect width="150" height="82" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="16" y="30" class="m" font-size="15" fill="#ddd6fe">- [x] 不变量</text>
      <text x="16" y="58" class="m" font-size="15" fill="#ddd6fe">- [ ] 刷 10 题</text>
    </g></g>
  </g>
</svg>
